name: Build Linux .deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    # Build on the oldest supported LTS so the produced binary links against
    # libraries that exist on newer Ubuntu/Debian too.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 \
            libsecret-1-dev libgtk-3-dev \
            fakeroot dpkg libfuse2

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Package with electron-builder (.deb and AppImage)
        run: npx electron-builder --linux deb AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job loudly if packaging produced no .deb. Without this the job
      # could finish "green" while the artifact upload silently matched nothing.
      - name: Verify .deb was produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(release/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::No .deb package was produced in release/"
            ls -la release/ || true
            exit 1
          fi
          for deb in "${debs[@]}"; do
            echo "== $deb =="
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" | grep -q 'usr/share/applications/.*\.desktop' \
              || { echo "::error::$deb is missing its .desktop entry"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Password-Vault-Browser-Linux
          if-no-files-found: warn
          path: |
            release/*.deb
            release/*.AppImage
